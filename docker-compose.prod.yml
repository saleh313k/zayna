# ZAYNA - PRODUCTION stack (single Linux server).   Local development uses docker-compose.yml instead.
#
#   internet --443/80--> web (Caddy: HTTPS, static site, /api proxy) --> api (.NET) --> db (SQL Server Express)
#
# Only `web` publishes ports. `api` and `db` are reachable ONLY on the private Docker network.
# All configuration comes from the .env file next to this file (copy .env.production.example; never commit it).
# Step-by-step instructions: docs/DEPLOYMENT.md

name: zayna-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"   # rotate logs so they can never fill the disk
    max-file: "5"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express   # free, production-licensed (limits: 10 GB per database, ~1.4 GB buffer pool)
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: ${DB_MEMORY_LIMIT_MB:-1536}
    volumes:
      - sqlserver_data:/var/opt/mssql   # persistent: survives container re-creation and image updates
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *default-logging
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zayna-api:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # The application connects as the dedicated least-privilege login created by deploy/scripts/init-db.sh.
      ConnectionStrings__DefaultConnection: "Server=db;Database=ZaynaDB;User Id=zayna_app;Password=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JwtSettings__Issuer: ${JWT_ISSUER:-ZAYNA.API}
      JwtSettings__Audience: ${JWT_AUDIENCE:-ZAYNA.Client}
      JwtSettings__ExpiryHours: ${JWT_EXPIRY_HOURS:-24}
      GoogleSettings__ClientId: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      Admin__Email: ${ADMIN_EMAIL:-}
      # Outgoing email (SMTP). Leave SMTP_HOST empty to disable email; bookings still work.
      Email__Provider: Smtp
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-ZAYNA}
      Cors__AllowedOrigins: https://${DOMAIN:?Set DOMAIN in .env}
      AllowedHosts: ${DOMAIN};localhost   # localhost is needed for the container health check
      Proxy__TrustForwardedHeaders: "true"   # safe here: the API is only reachable through Caddy
      Database__AutoMigrate: "false"   # schema changes are applied deliberately (docs/DEPLOYMENT.md)
      Payments__OnlineEnabled: "false"   # keep off until a payment provider is configured
      Booking__TimeZone: ${BOOKING_TIMEZONE:-Asia/Muscat}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    networks:
      - internal

  web:
    build:
      context: ./frontend
      dockerfile: ../deploy/web.Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
    image: zayna-web:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # keeps the issued certificates across restarts (avoids Let's Encrypt rate limits)
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *default-logging
    networks:
      - internal

volumes:
  sqlserver_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
