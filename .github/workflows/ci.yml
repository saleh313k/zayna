# Continuous integration: every push / pull request must build the API, run its tests, build the frontend,
# and prove the production Docker setup is still valid. It does NOT deploy anything (deployment is a manual,
# approved step - see docs/DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/ZAYNA.sln
      - name: Build
        run: dotnet build backend/ZAYNA.sln -c Release --no-restore
      - name: Test
        run: dotnet test backend/ZAYNA.sln -c Release --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_CLIENT_ID: ci-placeholder

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production compose file
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q
      - name: Build the API image
        run: docker build -t zayna-api:ci backend
      - name: Build the web image
        run: docker build -t zayna-web:ci -f deploy/web.Dockerfile --build-arg VITE_GOOGLE_CLIENT_ID=ci-placeholder frontend
